# blog/ 가 바뀌었을 때만 블로그를 빌드해서 gh-pages 브랜치의 blog/ 폴더에 배포합니다.
# blog/notes 는 ComputerScience 저장소의 sync-blog.yml 이 자동으로 커밋합니다.
name: Deploy blog

on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - '.github/workflows/deploy-blog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: blog

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blog/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: blog/dist
          target-folder: blog
          clean: true
          commit-message: 'Deploy blog from ${{ github.sha }}'
