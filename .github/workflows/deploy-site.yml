# site/ 가 바뀌었을 때만 포트폴리오를 빌드해서 gh-pages 브랜치 루트에 배포합니다.
# (gh-pages 의 blog/ 폴더는 건드리지 않음)
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: write

# site/blog 배포가 동시에 gh-pages 에 push 하지 않도록 순서대로 실행
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: site

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site/dist
          clean: true
          clean-exclude: |
            blog
            blog/**
          commit-message: 'Deploy site from ${{ github.sha }}'
