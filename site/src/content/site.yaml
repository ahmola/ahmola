# =============================================================
#  사이트 문구 모음
#  - 화면에 보이는 텍스트는 (프로젝트/스택 제외) 전부 여기서 수정합니다.
#  - 구조는 src/content.config.ts 의 `site` 스키마를 따릅니다.
#  - 지금 값은 전부 자리표시자(placeholder)입니다.
# =============================================================

meta:
  title: "ahmola.github.io"
  description: "Portfolio"
  lang: ko

# 상단 메뉴. href는 섹션 id(#about 등)와 맞춰 주세요.
nav:
  - label: About
    href: "#about"
  - label: Stack
    href: "#stack"
  - label: Projects
    href: "#projects"
  - label: Contact
    href: "#contact"
  - label: Blog
    href: "/blog/"

hero:
  prompt: "whoami"
  eyebrow: "Backend & DevOps"
  name: "박영서"
  tagline: "Full Cycle Developer"
  quote: "Forms follow Functions"
  actions:
    - label: "프로젝트 보기"
      href: "#projects"
    - label: "GitHub"
      href: "https://github.com/ahmola"

# 포트폴리오 PDF 다운로드 버튼 (첫 화면과 Contact 에 표시)
# site/public/files/portfolio.pdf 파일이 있을 때만 버튼이 나타납니다.
download:
  label: "포트폴리오 PDF"
  file: "/files/portfolio.pdf"
  filename: "portfolio.pdf"

about:
  title: About
  paragraphs:
    - "자기소개 첫 번째 문단."
    - "자기소개 두 번째 문단."

stack:
