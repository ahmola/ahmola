  description: "프로젝트 섹션 설명 (선택)"
  emptyText: "아직 등록된 프로젝트가 없습니다."
  labels:
    detail: "자세히 보기"
    github: "GitHub"
    demo: "Demo"
    back: "← 목록으로"
    period: "기간"
    role: "역할"
    stack: "사용 기술"

contact:
  title: Contact
  description: "연락 안내 문구 (선택)"
  links:
    - label: GitHub
      href: "https://github.com/ahmola"
